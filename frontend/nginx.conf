server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200M;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /login {
        proxy_pass http://backend:8080/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /logout {
        proxy_pass http://backend:8080/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /futsal.html { return 301 /futsal$is_args$args; }
    location = /volei.html { return 301 /volei$is_args$args; }
    location = /volei-praia.html { return 301 /volei-praia$is_args$args; }
    location = /handebol.html { return 301 /handebol$is_args$args; }
    location = /basquete.html { return 301 /basquete$is_args$args; }
    location = /iniciacao-esportiva.html { return 301 /iniciacao-esportiva$is_args$args; }
    location = /atletismo.html { return 301 /atletismo$is_args$args; }
    location = /atletismo-adaptado.html { return 301 /atletismo-adaptado$is_args$args; }
    location = /taekwondo.html { return 301 /taekwondo$is_args$args; }
    location = /hidroginastica.html { return 301 /hidroginastica$is_args$args; }
    location = /pilates.html { return 301 /pilates$is_args$args; }
    location = /ginastica-para-todos.html { return 301 /ginastica-para-todos$is_args$args; }
    location = /lian-gong.html { return 301 /lian-gong$is_args$args; }
    location = /futebol.html { return 301 /futebol$is_args$args; }
    location = /bale.html { return 301 /bale$is_args$args; }
    location = /detalhe-modalidade.html { return 301 /judo$is_args$args; }
    location = /zumba.html { return 301 /zumba$is_args$args; }
    location = /ginastica-artistica.html { return 301 /ginastica-artistica$is_args$args; }
    location = /xadrez.html { return 301 /xadrez$is_args$args; }
    location = /bicicross.html { return 301 /bicicross$is_args$args; }
    location = /natacao.html { return 301 /natacao$is_args$args; }
    location = /ginastica-ritmica.html { return 301 /ginastica-ritmica$is_args$args; }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }
}
