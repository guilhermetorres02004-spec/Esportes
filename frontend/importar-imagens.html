<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importar Imagens - Portal do Esporte Betim</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900 flex flex-col min-h-screen">

    <script>
        function sair() {
            fetch("/logout", { method: "POST", credentials: "include" })
                .finally(() => window.location.href = "administrativo.html");
        }
    </script>

    <header class="bg-blue-950 text-white py-2 text-xs font-bold uppercase tracking-widest text-center">
        Comunicação - Secretaria Municipal de Esportes
    </header>

    <nav class="bg-white border-b sticky top-0 z-50 shadow-sm h-20 flex items-center">
        <div class="max-w-7xl mx-auto w-full px-4 flex justify-between items-center">
            <div class="flex items-center gap-4 cursor-pointer" onclick="location.href='comunicacao.html'">
                <div class="bg-blue-900 text-white font-black p-2 rounded-lg text-xl w-10 h-10 flex items-center justify-center">B</div>
                <h1 class="text-blue-900 font-black text-xl uppercase italic tracking-tighter">Portal do Esporte</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="location.href='comunicacao.html'" class="border-2 border-blue-900 text-blue-900 px-4 py-1.5 rounded-full font-black hover:bg-blue-900 hover:text-white transition text-xs uppercase">
                    Voltar
                </button>
                <button onclick="sair()" class="border-2 border-red-600 text-red-600 px-4 py-1.5 rounded-full font-black hover:bg-red-600 hover:text-white transition text-xs uppercase">
                    Sair
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="border-l-8 border-blue-900 pl-6 mb-10">
            <h2 class="text-4xl font-black text-blue-900 uppercase italic tracking-tighter leading-none">Importar Imagens</h2>
            <p class="text-slate-500 font-bold uppercase text-xs mt-2 tracking-widest">Exibição no portal</p>
        </div>

        <form id="form-upload" class="bg-white rounded-[24px] shadow-md p-8 mb-10">
            <label class="block text-sm font-bold text-slate-600 mb-2" for="arquivo">Selecionar imagens (.jpg, .jpeg, .png, .webp, .gif — até 20MB cada, pode escolher várias de uma vez)</label>
            <input type="file" id="arquivo" name="arquivo" accept="image/jpeg,image/png,image/webp,image/gif" multiple required
                   class="block w-full text-sm border border-slate-300 rounded-lg p-2 mb-4">

            <div id="progresso-container" class="hidden mb-4">
                <div class="w-full bg-slate-200 rounded-full h-3">
                    <div id="progresso-barra" class="bg-blue-900 h-3 rounded-full transition-all" style="width:0%"></div>
                </div>
            </div>

            <p id="mensagem" class="text-sm mb-4 hidden"></p>

            <button type="submit" class="bg-blue-900 text-white font-black uppercase tracking-widest px-6 py-3 rounded-lg hover:bg-blue-800 transition">
                Enviar Imagens
            </button>
        </form>

        <div class="bg-white rounded-[24px] shadow-md p-8">
            <h3 class="text-lg font-black text-blue-900 uppercase italic mb-4">Imagens já importadas</h3>
            <div id="lista-imagens" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                <p class="col-span-full text-sm text-slate-400">Carregando...</p>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById("form-upload");
        const input = document.getElementById("arquivo");
        const mensagem = document.getElementById("mensagem");
        const progressoContainer = document.getElementById("progresso-container");
        const progressoBarra = document.getElementById("progresso-barra");
        const lista = document.getElementById("lista-imagens");

        function mostrarMensagem(texto, sucesso) {
            mensagem.textContent = texto;
            mensagem.classList.remove("hidden", "text-emerald-600", "text-red-600");
            mensagem.classList.add(sucesso ? "text-emerald-600" : "text-red-600");
        }

        async function carregarLista() {
            const response = await fetch("/api/imagens", { credentials: "include" });
            if (!response.ok) {
                lista.innerHTML = '<p class="col-span-full text-sm text-red-600">Não foi possível carregar a lista.</p>';
                return;
            }
            const imagens = await response.json();
            lista.innerHTML = imagens.length
                ? imagens.map((nome) => `
                    <div class="text-center">
                        <img src="Imagens/${encodeURIComponent(nome)}" class="w-full h-24 object-cover rounded-lg border border-slate-200 mb-1">
                        <p class="text-[10px] text-slate-500 truncate">${nome}</p>
                    </div>
                `).join("")
                : '<p class="col-span-full text-sm text-slate-400">Nenhuma imagem importada ainda.</p>';
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            if (!input.files.length) return;
            enviarArquivos(Array.from(input.files));
        });

        function enviarUmArquivo(arquivo) {
            return new Promise((resolve) => {
                const dados = new FormData();
                dados.append("arquivo", arquivo);

                const xhr = new XMLHttpRequest();
                xhr.open("POST", "/api/imagens");
                xhr.withCredentials = true;

                xhr.upload.onprogress = (event) => {
                    if (event.lengthComputable) {
                        progressoBarra.style.width = Math.round((event.loaded / event.total) * 100) + "%";
                    }
                };

                xhr.onload = () => resolve({ ok: xhr.status === 201, arquivo: arquivo.name, erro: xhr.responseText });
                xhr.onerror = () => resolve({ ok: false, arquivo: arquivo.name, erro: "Erro de conexão." });

                xhr.send(dados);
            });
        }

        async function enviarArquivos(arquivos) {
            progressoContainer.classList.remove("hidden");
            mensagem.classList.add("hidden");

            const falhas = [];
            for (let i = 0; i < arquivos.length; i++) {
                mensagem.classList.remove("hidden");
                mensagem.classList.remove("text-emerald-600", "text-red-600");
                mensagem.textContent = `Enviando ${i + 1} de ${arquivos.length}: ${arquivos[i].name}`;
                progressoBarra.style.width = "0%";

                const resultado = await enviarUmArquivo(arquivos[i]);
                if (!resultado.ok) falhas.push(resultado);
            }

            progressoContainer.classList.add("hidden");
            progressoBarra.style.width = "0%";

            const sucessos = arquivos.length - falhas.length;
            if (falhas.length === 0) {
                mostrarMensagem(`${sucessos} imagem(ns) enviada(s) com sucesso.`, true);
            } else {
                mostrarMensagem(`${sucessos} enviada(s), ${falhas.length} falharam: ${falhas.map(f => f.arquivo).join(", ")}`, false);
            }

            form.reset();
            carregarLista();
        }

        carregarLista();
    </script>
</body>
</html>
