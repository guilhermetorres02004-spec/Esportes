<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Circular - W&G Soluções</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- Variáveis de Cor --- */
        :root {
            --azul-escuro: #0f172a; /* Azul Marinho Profundo */
            --amarelo-ouro: #facc15; /* Amarelo Dourado (da paleta do projeto) */
            --texto-claro: #f8fafc;
            --glass-bg: rgba(15, 23, 42, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #020617; /* Fundo quase preto para destacar o menu */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Contêiner do Menu --- */
        .circular-menu {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Botão Central (Gatilho) --- */
        .menu-toggle {
            position: absolute;
            width: 80px;
            height: 80px;
            background: var(--azul-escuro);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 28px;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Estado aberto do botão */
        .circular-menu.active .menu-toggle {
            transform: rotate(135deg);
            background: #1e293b;
            box-shadow: 0 0 0 10px rgba(30, 64, 175, 0.2);
        }

        /* --- Efeito de Vidro (Overlay) --- */
        .menu-overlay {
            position: absolute;
            width: 0;
            height: 0;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 50%;
            z-index: 998;
            transition: all 0.7s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .circular-menu.active .menu-overlay {
            width: 200vw;
            height: 200vw;
            pointer-events: auto;
        }

        /* --- Itens do Menu --- */
        .menu-items {
            list-style: none;
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
        }

        .circular-menu.active .menu-items {
            pointer-events: auto;
        }

        .menu-item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }

        .circular-menu.active .menu-item {
            opacity: 1;
            transform: translate(var(--x), var(--y)) scale(1);
        }

        /* Estilo do Link e Ícone */
        .menu-link {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .menu-link i {
            font-size: 26px;
            width: 65px;
            height: 65px;
            background: var(--azul-escuro);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Hover nos itens */
        .menu-link:hover i {
            background: var(--amarelo-ouro);
            color: var(--azul-escuro);
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 8px 25px rgba(250, 204, 21, 0.4);
            border-color: rgba(250, 204, 21, 0.5);
        }

        .menu-link:hover span {
            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* --- Mobile Responsivo --- */
        @media (max-width: 600px) {
            .menu-toggle {
                width: 70px;
                height: 70px;
            }
            .menu-link i {
                width: 55px;
                height: 55px;
                font-size: 22px;
            }
            .menu-link span {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="circular-menu" id="circularMenu">
        
        <div class="menu-toggle" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
        
        <div class="menu-overlay"></div>

        <ul class="menu-items">
            <li class="menu-item">
                <a href="#home" class="menu-link" onclick="closeMenu()">
                    <i class="fas fa-home"></i>
                    <span>Início</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="#unidades" class="menu-link" onclick="closeMenu()">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Unidades</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="administrativo.html" class="menu-link" onclick="closeMenu()">
                    <i class="fas fa-file-signature"></i>
                    <span>Admin</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="#transparencia" class="menu-link" onclick="closeMenu()">
                    <i class="fas fa-eye"></i>
                    <span>Portal</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="downloads.html" class="menu-link" onclick="closeMenu()">
                    <i class="fas fa-cloud-download-alt"></i>
                    <span>Arquivos</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="#esporte" class="menu-link" onclick="closeMenu()">
                    <i class="fas fa-running"></i>
                    <span>Esporte</span>
                </a>
            </li>
        </ul>
    </div>

    <script>
        const menu = document.getElementById('circularMenu');
        const items = menu.querySelectorAll('.menu-item');
        
        // --- CONFIGURAÇÃO DE DISTÂNCIA ---
        // Aumente este valor para afastar os itens do centro
        let radius = 180; 

        function toggleMenu() {
            menu.classList.toggle('active');
            const icon = menu.querySelector('.menu-toggle i');
            
            if (menu.classList.contains('active')) {
                icon.classList.replace('fa-bars', 'fa-times');
                distributeItems();
            } else {
                icon.classList.replace('fa-times', 'fa-bars');
                resetItemsDelay();
            }
        }

        function closeMenu() {
            menu.classList.remove('active');
            const icon = menu.querySelector('.menu-toggle i');
            icon.classList.replace('fa-times', 'fa-bars');
            resetItemsDelay();
        }

        function distributeItems() {
            const totalItems = items.length;
            
            // 360 = Círculo completo | 180 = Meia lua superior
            const arcAngle = 360; 
            const startAngle = -90; // Começa no topo (12 horas)

            items.forEach((item, index) => {
                const angle = startAngle + (index * (arcAngle / totalItems));
                const rad = angle * (Math.PI / 180);
                
                // Cálculo da posição baseado no Raio
                const x = Math.round(Math.cos(rad) * radius);
                const y = Math.round(Math.sin(rad) * radius);
                
                item.style.setProperty('--x', `calc(-50% + ${x}px)`);
                item.style.setProperty('--y', `calc(-50% + ${y}px)`);
                
                // Efeito de entrada escalonado
                item.style.transitionDelay = `${index * 0.08}s`;
            });
        }

        function resetItemsDelay() {
            items.forEach(item => {
                item.style.transitionDelay = '0s';
            });
        }

        // Ajuste dinâmico para telas pequenas
        function updateRadius() {
            if (window.innerWidth < 600) {
                radius = 140; // Itens mais próximos no celular para não sumirem da tela
            } else {
                radius = 180;
            }
            if (menu.classList.contains('active')) distributeItems();
        }

        window.addEventListener('resize', updateRadius);
        updateRadius(); // Chama no carregamento inicial
    </script>
</body>
</html>
