<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Evento - SEMES Betim</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 10px; }
    </style>
    <link rel="stylesheet" href="/css/portal-header.css">
    <link rel="stylesheet" href="/css/portal-base.css">
</head>
<body class="portal-standard bg-slate-100 font-sans">
    <script src="/js/portal-header.js"></script>
    <div class="portal-page-content p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            
            <div class="bg-blue-900 p-6 text-white">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button onclick="window.history.back()" class="bg-white text-blue-900 font-black h-12 w-12 flex items-center justify-center rounded-lg text-2xl shadow-lg hover:bg-yellow-400 transition-all">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <div>
                            <h1 class="text-xl font-black uppercase italic tracking-tight">Detalhes do Evento</h1>
                            <p class="text-xs font-bold text-blue-200 uppercase tracking-widest">Secretaria de Esportes - Betim</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-8">
                <div id="eventoDetails" class="space-y-6">
                    <!-- Detalhes serão preenchidos por JavaScript -->
                </div>

                <div class="mt-8 flex gap-3 w-full">
                    <button onclick="window.history.back()" class="flex-1 px-12 py-4 bg-slate-300 text-slate-900 font-black rounded-xl hover:bg-slate-400 transition-all shadow-lg flex items-center justify-center gap-3 tracking-widest uppercase text-xs">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </button>
                    <button onclick="window.print()" class="flex-1 px-12 py-4 bg-blue-900 text-white font-black rounded-xl hover:bg-yellow-400 hover:text-blue-900 transition-all shadow-lg flex items-center justify-center gap-3 tracking-widest uppercase text-xs">
                        <i class="fas fa-print"></i> Imprimir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function abrirDetalhes() {
            const evento = JSON.parse(localStorage.getItem('eventoSelecionado'));
            
            if (!evento) {
                document.getElementById('eventoDetails').innerHTML = '<p class="text-red-600 font-bold">Nenhum evento selecionado.</p>';
                return;
            }

            const data = new Date(evento.data + 'T00:00:00');
            const dataFormatada = data.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const materiais = evento.materiais && evento.materiais.trim()
                ? evento.materiais
                : 'Nenhum material informado para este evento.';

            document.getElementById('eventoDetails').innerHTML = `
                <div class="bg-gradient-to-r from-blue-900 to-blue-700 text-white p-6 rounded-xl">
                    <h2 class="text-3xl font-black uppercase mb-2">${evento.titulo}</h2>
                    <p class="text-blue-100 font-bold text-lg">${evento.categoria}</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-blue-50 p-6 rounded-xl border-2 border-blue-200">
                        <p class="text-[10px] font-black text-blue-400 uppercase mb-2">Data e Hora</p>
                        <div class="flex items-center gap-3">
                            <div class="bg-blue-600 text-white p-3 rounded-lg">
                                <i class="fas fa-calendar-alt text-2xl"></i>
                            </div>
                            <div>
                                <p class="font-bold text-blue-900 uppercase text-sm">${dataFormatada}</p>
                                <p class="text-[11px] text-slate-600 font-bold"><i class="fas fa-clock mr-1"></i>Início: ${evento.hora}</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-red-50 p-6 rounded-xl border-2 border-red-200">
                        <p class="text-[10px] font-black text-red-400 uppercase mb-2">Local</p>
                        <div class="flex items-center gap-3">
                            <div class="bg-red-600 text-white p-3 rounded-lg">
                                <i class="fas fa-map-marker-alt text-2xl"></i>
                            </div>
                            <div>
                                <p class="font-bold text-blue-900 uppercase text-sm">${evento.local}</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-yellow-50 p-6 rounded-xl border-2 border-yellow-200 md:col-span-2">
                        <p class="text-[10px] font-black text-yellow-600 uppercase mb-2">Responsável pelo Evento</p>
                        <div class="flex items-center gap-3">
                            <div class="bg-yellow-500 text-white p-3 rounded-lg">
                                <i class="fas fa-user-tie text-2xl"></i>
                            </div>
                            <div>
                                <p class="font-bold text-blue-900 uppercase text-sm">${evento.responsavel}</p>
                                <p class="text-[11px] text-slate-600 font-bold">Coordenador do Evento</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-50 p-6 rounded-xl border-2 border-slate-200">
                    <p class="text-[10px] font-black text-slate-500 uppercase mb-3">Descrição do Evento</p>
                    <p class="text-slate-700 font-semibold leading-relaxed">${evento.descricao}</p>
                </div>

                <div class="bg-emerald-50 p-6 rounded-xl border-2 border-emerald-200">
                    <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                        <div>
                            <p class="text-[10px] font-black text-emerald-600 uppercase mb-3">Materiais necessários</p>
                            <p class="text-slate-700 font-semibold leading-relaxed whitespace-pre-line">${materiais}</p>
                        </div>
                        <a href="almoxarifado.html" class="shrink-0 bg-emerald-600 text-white px-5 py-3 rounded-xl font-black uppercase text-xs hover:bg-blue-900 transition-all text-center">
                            <i class="fas fa-boxes-stacked mr-2"></i> Solicitar Material
                        </a>
                    </div>
                </div>

                <div class="bg-blue-100 p-4 rounded-xl border-l-4 border-blue-600">
                    <p class="text-[10px] font-black text-blue-600 uppercase mb-1">Informações Importantes</p>
                    <ul class="text-sm text-blue-900 font-semibold space-y-1">
                        <li><i class="fas fa-check-circle text-blue-600 mr-2"></i>Chegue com 15 minutos de antecedência</li>
                        <li><i class="fas fa-check-circle text-blue-600 mr-2"></i>Leve documento de identificação</li>
                        <li><i class="fas fa-check-circle text-blue-600 mr-2"></i>Use uniforme/roupa apropriada</li>
                        <li><i class="fas fa-check-circle text-blue-600 mr-2"></i>Em caso de dúvidas, contate o responsável</li>
                    </ul>
                </div>
            `;
        }

        abrirDetalhes();
    </script>
    </div>
</body>
</html>
