<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>BETA - Matrix Impact</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        let width, height, columns;
        const fontSize = 18;
        // Mix de caracteres para a chuva
        const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺｻｼｽ";
        let drops = [];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = Math.floor(width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
        }

        function draw() {
            // Rastro para persistência visual
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            ctx.fillRect(0, 0, width, height);

            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                
                // Verde Matrix
                ctx.fillStyle = "#00FF41"; 
                
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                // Brilho intenso ao cruzar o centro
                if (y > height/2 - 100 && y < height/2 + 100 && x > width/2 - 250 && x < width/2 + 250) {
                    ctx.fillStyle = "#FFFFFF";
                    ctx.shadowColor = "#00FF41";
                    ctx.shadowBlur = 10;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(text, x, y);

                if (y > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            drawMainText();
        }

        function drawMainText() {
            ctx.save();
            const text = "BETA";
            // Fonte impactante e geométrica
            ctx.font = "900 180px 'Arial Black', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // 1. Cria a máscara (apaga o que está atrás)
            ctx.globalCompositeOperation = "destination-out";
            ctx.fillText(text, width / 2, height / 2);
            
            // 2. Adiciona o contorno neon sutil
            ctx.globalCompositeOperation = "source-over";
            ctx.strokeStyle = "rgba(0, 255, 65, 0.5)";
            ctx.lineWidth = 4;
            ctx.strokeText(text, width / 2, height / 2);

            // 3. Glitch ocasional para impacto
            if (Math.random() > 0.98) {
                ctx.fillStyle = "rgba(0, 255, 65, 0.15)";
                ctx.fillText(text, width / 2 + (Math.random()-0.5)*15, height / 2);
            }
            
            ctx.restore();
        }

        window.addEventListener('resize', init);
        init();
        setInterval(draw, 40);
    </script>
</body>
</html>
