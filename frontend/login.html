<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Administrativo - Portal do Esporte Betim</title>
<link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/portal-header.css">
    <link rel="stylesheet" href="/css/portal-base.css">
</head>
<body class="portal-standard bg-slate-100 min-h-screen flex flex-col">
    <script src="/js/portal-header.js"></script>
    <main class="flex-grow flex items-center justify-center w-full p-4">

    <div class="w-full max-w-4xl bg-white shadow-2xl rounded-3xl overflow-hidden grid md:grid-cols-2">

        <div class="relative hidden md:block min-h-[420px]">
            <img src="Imagens/imagemLogin.jpeg" alt="Evento Esportivo de Betim"
                 class="absolute inset-0 w-full h-full object-cover"
                 onerror="this.src='https://images.unsplash.com/photo-1519315901367-f34ff9154487?q=80&w=1200'">
            <div class="absolute inset-0 bg-gradient-to-t from-blue-950/90 via-blue-900/40 to-blue-900/10"></div>
            <div class="relative h-full flex flex-col justify-between p-8 text-white">
                <div class="flex items-center gap-3">
                    <div class="bg-white text-blue-900 font-black w-10 h-10 rounded-lg flex items-center justify-center text-xl">B</div>
                    <span class="font-black uppercase italic tracking-tighter text-lg">Portal do Esporte</span>
                </div>
                <div>
                    <p class="text-xs font-bold uppercase tracking-widest text-blue-200 mb-1">Prefeitura de Betim</p>
                    <h2 class="text-3xl font-black uppercase leading-tight">Secretaria Municipal de Esportes</h2>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-center p-8 sm:p-12">
            <form id="login-form" class="w-full max-w-sm space-y-4">
                <div class="mb-6">
                    <h1 class="text-2xl font-black text-blue-900 uppercase">Área Administrativa</h1>
                    <p class="text-sm text-slate-500 mt-1">Acesso restrito. Informe suas credenciais para continuar.</p>
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-slate-500" for="username">Usuário</label>
                    <input id="username" name="username" type="text" required autocomplete="username"
                           class="w-full mt-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-900">
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-slate-500" for="password">Senha</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password"
                           class="w-full mt-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-900">
                </div>

                <p id="error-msg" class="text-red-600 text-sm hidden">Usuário ou senha inválidos.</p>

                <button type="submit" class="w-full bg-blue-900 text-white font-black uppercase tracking-widest py-3 rounded-lg hover:bg-blue-800 transition">
                    Entrar
                </button>

                <button type="button" onclick="location.href='index.html'"
                        class="w-full bg-slate-100 text-slate-600 font-black uppercase tracking-widest py-3 rounded-lg hover:bg-slate-200 transition">
                    Cancelar
                </button>
            </form>
        </div>

    </div>

    </main>

    <script>
        const form = document.getElementById("login-form");
        const errorMsg = document.getElementById("error-msg");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorMsg.classList.add("hidden");

            const body = new URLSearchParams();
            body.set("username", document.getElementById("username").value);
            body.set("password", document.getElementById("password").value);

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body,
                });

                if (response.ok) {
                    const proxima = new URLSearchParams(window.location.search).get("proxima");
                    window.location.href = proxima === "agendamento-quadras.html"
                        ? proxima : "administrativo.html";
                    return;
                }
                errorMsg.textContent = response.status === 401
                    ? "Usuário ou senha inválidos."
                    : "Não foi possível acessar o servidor. Tente novamente em instantes.";
            } catch {
                errorMsg.textContent = "Não foi possível conectar ao servidor. Verifique sua conexão.";
            }
            errorMsg.classList.remove("hidden");
        });
    </script>
</body>
</html>
