<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicação - Portal do Esporte Betim</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900 flex flex-col min-h-screen">

    <script>
        fetch("/api/auth/me", { credentials: "include" }).then((response) => {
            if (!response.ok) {
                window.location.href = "login.html";
            }
        });

        function sair() {
            fetch("/logout", { method: "POST", credentials: "include" })
                .finally(() => window.location.href = "login.html");
        }
    </script>

    <header class="bg-blue-950 text-white py-2 text-xs font-bold uppercase tracking-widest text-center">
        Comunicação - Secretaria Municipal de Esportes
    </header>

    <nav class="bg-white border-b sticky top-0 z-50 shadow-sm h-20 flex items-center">
        <div class="max-w-7xl mx-auto w-full px-4 flex justify-between items-center">
            <div class="flex items-center gap-4 cursor-pointer" onclick="location.href='administrativo.html'">
                <div class="bg-blue-900 text-white font-black p-2 rounded-lg text-xl w-10 h-10 flex items-center justify-center">B</div>
                <h1 class="text-blue-900 font-black text-xl uppercase italic tracking-tighter">Portal do Esporte</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="location.href='administrativo.html'" class="border-2 border-blue-900 text-blue-900 px-4 py-1.5 rounded-full font-black hover:bg-blue-900 hover:text-white transition text-xs uppercase">
                    Voltar
                </button>
                <button onclick="sair()" class="border-2 border-red-600 text-red-600 px-4 py-1.5 rounded-full font-black hover:bg-red-600 hover:text-white transition text-xs uppercase">
                    Sair
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="border-l-8 border-blue-900 pl-6 mb-10">
            <h2 class="text-4xl font-black text-blue-900 uppercase italic tracking-tighter leading-none">Comunicação</h2>
            <p class="text-slate-500 font-bold uppercase text-xs mt-2 tracking-widest">Conteúdo e Divulgação</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <a href="importar-videos.html" class="admin-card block bg-white border-b-8 border-blue-900 rounded-[30px] p-8 shadow-md hover:-translate-y-1 transition">
                <i class="fas fa-video text-3xl text-blue-900 mb-4"></i>
                <h3 class="text-lg font-black text-blue-900 uppercase italic mb-2">Importar Vídeos</h3>
                <p class="text-sm text-slate-500">Envie vídeos para exibição na página inicial do portal.</p>
            </a>
            <a href="importar-imagens.html" class="admin-card block bg-white border-b-8 border-emerald-500 rounded-[30px] p-8 shadow-md hover:-translate-y-1 transition">
                <i class="fas fa-images text-3xl text-emerald-500 mb-4"></i>
                <h3 class="text-lg font-black text-blue-900 uppercase italic mb-2">Importar Imagens</h3>
                <p class="text-sm text-slate-500">Envie imagens para exibição no portal.</p>
            </a>
        </div>
    </main>

</body>
</html>
