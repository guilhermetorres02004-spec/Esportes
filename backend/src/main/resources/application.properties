spring.application.name=portal-esporte-api
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/portal_esporte
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.upload.dir=${APP_UPLOAD_DIR:../frontend/public/Videos}
app.upload.imagens.dir=${APP_UPLOAD_IMAGENS_DIR:../frontend/public/Imagens}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Sem chave, o suporte responde por consulta às referências do portal.
# Credenciais somente no servidor; nunca em VITE_* ou arquivos públicos.
app.suporte.ia.chave=${OPENAI_API_KEY:}
app.suporte.ia.modelo=${SUPORTE_IA_MODELO:gpt-5-mini}

app.fotos.dir=${FOTOS_CACHE_DIR:./data/fotos-oficiais}
app.fotos.habilitado=${FOTOS_SYNC_ENABLED:true}
app.fotos.intervalo-segundos=${FOTOS_SYNC_INTERVALO:7200}

app.conquistas.dir=${CONQUISTAS_CACHE_DIR:./data/conquistas-oficiais}
app.conquistas.habilitado=${CONQUISTAS_SYNC_ENABLED:true}
app.conquistas.intervalo-segundos=${CONQUISTAS_SYNC_INTERVALO:3600}
