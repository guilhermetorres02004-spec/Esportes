spring.application.name=portal-esporte-api
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/portal_esporte
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.upload.dir=${APP_UPLOAD_DIR:../frontend/public/Videos}
app.upload.imagens.dir=${APP_UPLOAD_IMAGENS_DIR:../frontend/public/Imagens}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
