services:
  backend:
    build: ./backend
    ports:
      - "18080:8080"
    environment:
      - APP_UPLOAD_DIR=/app/videos
      - APP_UPLOAD_IMAGENS_DIR=/app/imagens
    volumes:
      - ./frontend/public/Videos:/app/videos
      - ./frontend/public/Imagens:/app/imagens

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/public/Videos:/usr/share/nginx/html/Videos
      - ./frontend/public/Imagens:/usr/share/nginx/html/Imagens
